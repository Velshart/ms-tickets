spring.application.name=api-gateway
server.port=8080

jwt.secret=${JWT_SECRET}

# 1. User Service - Auth
spring.cloud.gateway.server.webflux.routes[0].id=user-service-auth-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=PreserveHostHeader
spring.cloud.gateway.server.webflux.routes[0].filters[1]=AddRequestHeader=X-Forwarded-Host, localhost:8080
spring.cloud.gateway.server.webflux.routes[0].filters[2]=AddRequestHeader=X-Forwarded-Port, 8080
spring.cloud.gateway.server.webflux.routes[0].filters[3]=AddRequestHeader=X-Forwarded-Proto, http

# 2. User Service - Users
spring.cloud.gateway.server.webflux.routes[1].id=user-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=PreserveHostHeader
spring.cloud.gateway.server.webflux.routes[1].filters[1]=AddRequestHeader=X-Forwarded-Host, localhost:8080
spring.cloud.gateway.server.webflux.routes[1].filters[2]=AddRequestHeader=X-Forwarded-Port, 8080
spring.cloud.gateway.server.webflux.routes[1].filters[3]=AddRequestHeader=X-Forwarded-Proto, http

# 3. Ticket Service
spring.cloud.gateway.server.webflux.routes[2].id=ticket-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/events/**,/api/orders/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=PreserveHostHeader
spring.cloud.gateway.server.webflux.routes[2].filters[1]=AddRequestHeader=X-Forwarded-Host, localhost:8080
spring.cloud.gateway.server.webflux.routes[2].filters[2]=AddRequestHeader=X-Forwarded-Port, 8080
spring.cloud.gateway.server.webflux.routes[2].filters[3]=AddRequestHeader=X-Forwarded-Proto, http